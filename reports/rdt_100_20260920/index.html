<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A2D · 测评看板</title><link rel="stylesheet" href="./style.css"></head><body><main><header><div><div class="eyebrow">A2D EVAL / EXPERIMENTS</div><h1>测评看板<span>只读</span></h1><p>模型表现、测试覆盖与失败现象，一处查看。</p></div><button id="refresh">刷新数据 ↻</button></header><div id="notice" role="status">正在读取测试记录…</div><section class="filters"><label>测试批次<select id="batch"></select></label><label>场景<select id="scene"></select></label><label>模型<select id="model"></select></label><label>训练数据<select id="training_data"></select></label><label>测试方法<select id="method"></select></label></section><section id="stats" class="stats"></section><section class="panel"><div class="section-title"><h2>模型测试结果</h2><small>点击一行查看参数与失败分布</small></div><div class="scroll"><table><thead><tr><th>模型 / 批次</th><th>训练数据</th><th>场景</th><th>测试方法</th><th>成功率</th><th>已记录 / 计划</th><th>无效</th><th>主要失败现象</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="detail" class="panel detail"><h2>选择一条结果</h2><p>查看测试参数、分母口径和失败分布。</p></section><footer>成功率 = 成功 ÷ 有效回合；无效单列。不同批次不合并排名。失败现象不是已证实的因果。</footer></main><script>window.STATIC_REPORT=true;</script><script src="./app.js"></script></body></html>
